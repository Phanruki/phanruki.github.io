<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>

    <link rel="stylesheet" href="css/body.css" />
    <link rel="stylesheet" href="css/stylesheet.css" />
    <link rel="stylesheet" href="css/stylesheet-small.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://fonts.googleapis.com/css?family=Poppins"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://fonts.googleapis.com/css?family=Pridi"
    />
  </head>
  <body>
    <div id="loader" class="title">Cargando...</div>

    <header id="header__row">
      <div id="menu__header">
        <div class="menu__arrow"></div>
      </div>
      <nav class="header__row__text">
        <div class="header__row__background"></div>
        <a class="title--header" href="">Sobre mi</a>
        <a class="title--header" href="">Habilidades</a>
        <a class="title--header" href="">Formación</a>
        <a class="title--header" href="">Portafolio</a>
        <a class="title--header" href="">Contacto </a>
      </nav>

      <div id="header__color" class="header__row__color-change">
        <div id="menu__color-change" class="hidden">
          <div class="menu__arrow"></div>
        </div>

        <div id="color-change">
          <a class="color-change" id="version--dark--trigger"></a>
          <a class="color-change" id="version--white--trigger"></a>
          <a class="color-change" id="version--pink--trigger"></a>
        </div>
      </div>
    </header>

    <div id="container__body">
      <div class="container__main">
        <img
          src="/assets/photos/profile-photo.webp"
          alt=""
          class="main__profile-photo"
        />
        <div class="container__main__titles">
          <h1 class="title">Phanruki</h1>
          <h2 class="title--sub">Yadid Soto</h2>
          <h3 class="title--sub--sub">
            Estudiante de Ingenieria en Tecnologías Computacionales
          </h3>
        </div>
        <div class="container__main__social-icons">
          <a
            class="social-icon"
            style="
              --icon-url: url('../assets/social-icons/icon__instagram.svg');
            "
            href=""
          ></a>
          <a
            class="social-icon"
            style="--icon-url: url('../assets/social-icons/icon__discord.svg')"
            href=""
          ></a>
          <a
            class="social-icon"
            style="--icon-url: url('../assets/social-icons/icon__github.svg')"
            href=""
          ></a>
          <a
            class="social-icon"
            style="--icon-url: url('../assets/social-icons/icon__facebook.svg')"
            href=""
          ></a>
          <a
            class="social-icon"
            style="--icon-url: url('../assets/social-icons/icon__twitter.svg')"
            href=""
          ></a>
          <a
            class="social-icon"
            style="--icon-url: url('../assets/social-icons/icon__linkedin.svg')"
            href=""
          ></a>
        </div>
        <div class="container__main__buttons">
          <a
            href=""
            style="
              --button-color: var(--black--light--dark);
              color: var(--white);
            "
            class="button title--header"
            >Mira mi CV</a
          >
          <a
            href=""
            style="--button-color: var(--white)"
            class="button title--header"
            >Contactame</a
          >
        </div>
      </div>
      <div class="container__sub"></div>
    </div>

    <script type="module" src="js/settings.js"></script>
    <script type="module" src="js/const.js"></script>
  </body>
</html>
